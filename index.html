<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scaley</title>
<meta name="description" content="Scaley: the scale that ignores your water weight and tells you the truth.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scaley">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f5fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0e18" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one phone column of soft cards, floating tab bar with a centre + button, bottom sheets for every action. Scaley the yellow scale is the mascot. */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --surface2:#eef1f7; --fg:#121629; --muted:#626a88; --faint:#9ea4bb; --line:#e2e6ef;
  --accent:#5b4ff5; --accent2:#8d7dff; --accent-soft:#ecebff; --btn:#5b4ff5; --on-accent:#ffffff;
  --sun:#ffc93c; --sun-soft:#fff5d6;
  --good:#12a46a; --good-soft:#dcf6ea; --good-ink:#0b7a4d;
  --warn:#f08c00; --warn-soft:#fff0d9; --warn-ink:#a65f00;
  --bad:#e5405a; --bad-soft:#ffe3e8; --bad-ink:#c42a43;
  --prot:#ff5577; --carb:#ff9a2a; --fat:#3a86ff; --plan:#b4bacb;
  --shadow:0 1px 2px rgba(18,22,41,.04),0 12px 32px -12px rgba(18,22,41,.14);
  --ink:#121629; --scrim:rgba(14,16,30,.42); --glass:rgba(255,255,255,.84);
  --f-display:"Fredoka",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  --f-body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0e18; --surface:#161a29; --surface2:#1f2337; --fg:#eef0f8; --muted:#a0a7c2; --faint:#6b7290; --line:#282c42;
  --accent:#8b80ff; --accent2:#b0a6ff; --accent-soft:#25234a; --btn:#6a5cff; --on-accent:#ffffff;
  --sun:#ffd257; --sun-soft:#3a3218;
  --good:#3fd690; --good-soft:#123527; --good-ink:#4fe09c;
  --warn:#ffae3d; --warn-soft:#3a2a10; --warn-ink:#ffb54d;
  --bad:#ff6b80; --bad-soft:#3d1922; --bad-ink:#ff8395;
  --prot:#ff7a95; --carb:#ffb04d; --fat:#5aa2ff; --plan:#545b78;
  --shadow:0 0 0 1px #232740; --ink:#05060c; --scrim:rgba(0,0,0,.6); --glass:rgba(22,26,41,.88); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0e18; --surface:#161a29; --surface2:#1f2337; --fg:#eef0f8; --muted:#a0a7c2; --faint:#6b7290; --line:#282c42;
  --accent:#8b80ff; --accent2:#b0a6ff; --accent-soft:#25234a; --btn:#6a5cff; --on-accent:#ffffff;
  --sun:#ffd257; --sun-soft:#3a3218;
  --good:#3fd690; --good-soft:#123527; --good-ink:#4fe09c;
  --warn:#ffae3d; --warn-soft:#3a2a10; --warn-ink:#ffb54d;
  --bad:#ff6b80; --bad-soft:#3d1922; --bad-ink:#ff8395;
  --prot:#ff7a95; --carb:#ffb04d; --fat:#5aa2ff; --plan:#545b78;
  --shadow:0 0 0 1px #232740; --ink:#05060c; --scrim:rgba(0,0,0,.6); --glass:rgba(22,26,41,.88); color-scheme:dark}

html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-weight:600;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
html.locked,html.locked body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none}
input,textarea{font:inherit;color:var(--fg)}
button:focus-visible,input:focus-visible,textarea:focus-visible,.sheet:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sheet:focus{outline:none}
.num{font-variant-numeric:tabular-nums}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.disp{font-family:var(--f-display);font-weight:600}

.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(118px + env(safe-area-inset-bottom,0px))}
.screen{display:flex;flex-direction:column;gap:14px}
.screen.coach{padding-bottom:84px}
.screen.me.dirty{padding-bottom:84px}
.card{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{box-shadow:none}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.brand{display:flex;align-items:center;gap:8px}
.wordmark{font-family:var(--f-display);font-weight:700;font-size:25px;letter-spacing:.01em}
.h1{font-family:var(--f-display);font-weight:700;font-size:27px;margin:0}
.h2{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0}
.lbl{font-size:12.5px;color:var(--muted);font-weight:700}
.sub{font-size:13.5px;color:var(--muted)}
.sub b{color:var(--fg)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:6px 11px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow)}
.chip svg{width:16px;height:16px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:17px;border-radius:18px;padding:14px 18px;background:var(--btn);color:var(--on-accent);width:100%;transition:transform .12s ease;box-shadow:0 8px 20px -10px var(--btn)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:default}
.btn.soft{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.btn.plain{background:var(--surface2);color:var(--fg);box-shadow:none}
.sheet .btn.plain{background:var(--surface);box-shadow:var(--shadow)}
.btn.danger{background:var(--bad-soft);color:var(--bad-ink);box-shadow:none}
.btn.sm{font-size:14.5px;padding:10px 14px;border-radius:14px;width:auto}
.btn.wide{width:100%}
.btn svg{width:20px;height:20px}
.icon-btn{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--surface2);color:var(--fg);flex:none;transition:transform .12s}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:20px;height:20px}
.link{color:var(--accent);font-weight:800;text-decoration:none}
.linkbtn{color:var(--accent);font-weight:800;font-size:13.5px;align-self:flex-start;padding:2px 4px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* day strip */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 38px;gap:3px;align-items:center}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:16px;transition:background .2s;min-width:0}
.day .dw{font-size:11.5px;color:var(--muted);font-weight:800}
.day .dd{position:relative;width:34px;height:34px;display:grid;place-items:center}
.day .dd svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.day .dd b{font-family:var(--f-display);font-weight:600;font-size:14px;position:relative}
.day[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.day[aria-pressed="true"] .dw{color:var(--accent)}
.calpick{position:relative;width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.calpick svg{width:20px;height:20px}
.calpick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

/* calorie card */
.cal{display:grid;grid-template-columns:1fr 132px;align-items:center;gap:8px;padding:20px}
.cal .big{font-family:var(--f-display);font-weight:700;font-size:52px;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.cal .big.over{color:var(--bad)}
.cal .unit{font-size:15px;color:var(--muted);font-weight:800;margin-top:4px}
.cal .mini{display:flex;gap:16px;margin-top:12px;font-size:13px;color:var(--muted)}
.cal .mini b{display:block;color:var(--fg);font-family:var(--f-display);font-weight:600;font-size:17px}
.ringbox{position:relative;width:132px;height:132px}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ringbox .ico{position:absolute;inset:0;display:grid;place-items:center}
.ringbox .ico svg{width:34px;height:34px;transform:none}
.ring-trk{fill:none;stroke:var(--surface2)}
.ring-p{fill:none;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.3,1,.4,1),stroke .3s}
.status{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;padding:10px 12px;border-radius:14px;background:var(--surface2);color:var(--muted)}
.status .dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.status.good{background:var(--good-soft);color:var(--good-ink)}
.status.warn{background:var(--warn-soft);color:var(--warn-ink)}
.status.bad{background:var(--bad-soft);color:var(--bad-ink)}

/* macros */
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.macro{padding:14px 12px;gap:4px;box-shadow:none}
.macro b{font-family:var(--f-display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.macro .lbl{font-size:12.5px;color:var(--fg)}
.macro .ms{font-size:11.5px;color:var(--muted)}
.mbar{height:7px;border-radius:4px;background:var(--surface2);overflow:hidden;margin-top:6px}
.mbar i{display:block;height:100%;width:0;border-radius:4px;transition:width .9s cubic-bezier(.3,1,.4,1)}
.macro.over b{color:var(--warn-ink)}
.macro.done b{color:var(--good-ink)}

/* tip */
.tip{flex-direction:row;align-items:center;gap:12px;background:var(--accent-soft);box-shadow:none;text-align:left}
.tip .mascot{width:52px}
.tip .tp{font-size:14.5px;line-height:1.4}
.tip .go{color:var(--accent);font-weight:800;font-size:13.5px;display:inline-flex;align-items:center;gap:4px}

/* weight card */
.wcard{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;box-shadow:none}
.wcard .wv{font-family:var(--f-display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
.wcard .wv small{font-size:15px;color:var(--muted);margin-left:3px}
.delta{font-size:13px;font-weight:800}
.delta.dn{color:var(--good-ink)} .delta.up{color:var(--warn-ink)} .delta.flat{color:var(--muted)}
.spark{grid-column:1/-1}
.spark svg{width:100%;height:auto;display:block}

/* meals */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin-top:6px;padding:0 4px}
.meal-group{display:flex;flex-direction:column;gap:8px}
.mg-head{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:800;padding:4px 6px 0}
.entry{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border-radius:20px;padding:10px 14px 10px 10px;box-shadow:var(--shadow);text-align:left;width:100%;transition:transform .12s}
.entry:active{transform:scale(.98)}
.thumb{width:56px;height:56px;border-radius:16px;background:var(--surface2);display:grid;place-items:center;font-size:27px;overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.entry .en{min-width:0}
.entry .en b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .en .macs{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:4px;font-size:12.5px;color:var(--muted)}
.mc{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.mc i{width:7px;height:7px;border-radius:50%;display:inline-block}
.entry .ek{text-align:right}
.entry .ek b{font-family:var(--f-display);font-weight:600;font-size:18px;display:block}
.entry .ek span{font-size:12px;color:var(--muted)}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:22px 16px}
.empty svg.ill{width:96px;height:96px}
.empty p{margin:0;color:var(--muted);max-width:30ch}
.quick3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:18px;background:var(--surface2);font-size:13px;font-weight:800}
.qa svg{width:24px;height:24px;color:var(--accent)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 max(10px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(10px,env(safe-area-inset-right,0px));background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line)}
.tabbar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:end;height:64px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;color:var(--muted);font-size:11.5px;font-weight:800;transition:color .2s}
.tab svg{width:25px;height:25px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] svg{transform:translateY(-1px) scale(1.06)}
.fab{justify-self:center;width:62px;height:62px;border-radius:22px;background:var(--btn);color:#fff;display:grid;place-items:center;transform:translateY(-16px);box-shadow:0 12px 24px -8px var(--btn),0 0 0 5px var(--bg);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.fab svg{width:30px;height:30px;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.fab:active{transform:translateY(-16px) scale(.93)}
.fab.open svg{transform:rotate(45deg)}

/* floating bars above the tab bar */
.composer,.savebar{position:fixed;left:0;right:0;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:19;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,transparent,var(--bg) 30%)}
.composer .in,.savebar .in{max-width:520px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.savebar .in{align-items:center;background:var(--fg);color:var(--bg);border-radius:20px;padding:8px 8px 8px 16px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.savebar .in span{flex:1;font-weight:800;font-size:14px}
.savebar .btn{width:auto}
.savebar .undo{color:var(--bg);opacity:.8;font-weight:800;font-size:14px;padding:8px}
.composer textarea{flex:1;min-width:0;border:0;border-radius:22px;background:var(--surface);box-shadow:var(--shadow);padding:12px 16px;font-size:16px;font-weight:700;resize:none;max-height:120px;min-height:46px;box-sizing:border-box;line-height:1.35}
.composer textarea:focus{outline:none;box-shadow:0 0 0 2px var(--accent)}
.send{width:46px;height:46px;border-radius:50%;background:var(--btn);color:#fff;display:grid;place-items:center;flex:none;transition:transform .12s}
.send:active{transform:scale(.9)}
.send:disabled{opacity:.4}
.send svg{width:22px;height:22px}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;transition:opacity .28s;z-index:40}
.scrim.in{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;margin:0 auto;max-width:560px;max-height:calc(100% - env(safe-area-inset-top,0px) - 18px);background:var(--bg);border-radius:28px 28px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .36s cubic-bezier(.2,.95,.25,1);box-shadow:0 -10px 40px -10px rgba(0,0,0,.3)}
.sheet.in{transform:translateY(0)}
.sheet.drag{transition:none}
.grab{flex:none;height:22px;display:grid;place-items:center;cursor:grab;touch-action:none}
.grab::after{content:"";width:40px;height:5px;border-radius:3px;background:var(--line)}
.sheet.fixed .grab{visibility:hidden;height:14px}
.sh-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 max(16px,env(safe-area-inset-right,0px)) 8px max(18px,env(safe-area-inset-left,0px));touch-action:none}
.sh-head h3{font-family:var(--f-display);font-weight:600;font-size:21px;margin:0;min-width:0;overflow-wrap:anywhere}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.sheet.hasfoot .sh-body{padding-bottom:16px}
.sh-foot{flex:none;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;gap:10px}
.sheet.full{height:calc(100% - env(safe-area-inset-top,0px) - 18px)}

/* plus sheet */
.plus-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pt{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow);text-align:left;transition:transform .12s;min-width:0}
.pt:active{transform:scale(.97)}
.pt .pi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.pt .pi svg{width:24px;height:24px}
.pt b{font-family:var(--f-display);font-weight:600;font-size:17px}
.pt span{font-size:12.5px;color:var(--muted);margin-top:-6px}
.pt.hero{grid-column:1/-1;flex-direction:row;align-items:center;background:var(--btn);color:#fff;box-shadow:0 14px 28px -14px var(--btn)}
.pt.hero .pi{background:rgba(255,255,255,.2)}
.pt.hero span{color:rgba(255,255,255,.88)}
.pt.hero .tx{display:flex;flex-direction:column;gap:2px}
.pt.hero .tx span{margin:0}
.adding{font-size:13px;color:var(--muted);text-align:center}

/* steppers */
.stepper{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;gap:6px;background:var(--surface);border-radius:18px;padding:5px;box-shadow:var(--shadow)}
.stepper .sv{display:flex;align-items:baseline;justify-content:center;gap:4px;min-width:0;overflow:hidden;cursor:text}
.stepper input{border:0;background:transparent;text-align:center;font-family:var(--f-display);font-weight:700;font-size:26px;width:3ch;max-width:100%;min-width:0;padding:0;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input:focus{outline:none}
.stepper input::placeholder{color:var(--faint)}
.stepper .su{font-size:14px;color:var(--muted);font-weight:800;flex:none}
.stepper:focus-within{box-shadow:0 0 0 2px var(--accent)}
.sb{width:48px;height:48px;border-radius:14px;background:var(--surface2);font-family:var(--f-display);font-size:24px;font-weight:600;display:grid;place-items:center;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:transform .1s}
.sb:active{transform:scale(.9)}
.stepper.xl{grid-template-columns:60px minmax(0,1fr) 60px;padding:8px;border-radius:24px}
.stepper.xl .sb{width:60px;height:60px;border-radius:18px;font-size:30px}
.stepper.xl input{font-size:44px}
.stepper.xl .su{font-size:18px}
.stepper.sm{grid-template-columns:38px minmax(0,1fr) 38px;gap:4px;border-radius:14px;padding:4px;box-shadow:none;background:var(--surface2)}
.stepper.sm .sb{width:38px;height:40px;border-radius:11px;font-size:20px;background:var(--surface)}
.stepper.sm input{font-size:19px}
.stepper.sm .su{font-size:12px}

/* fields */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>.lbl{padding-left:4px}

.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);box-sizing:border-box;flex:none;transition:border .2s}

.sr[aria-pressed="true"]{box-shadow:0 0 0 2px var(--btn)}
.switch{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.note{font-size:13px;padding:10px 12px;border-radius:14px;background:var(--surface2);color:var(--muted)}
.sheet .note{background:var(--surface)}
.note.warn{background:var(--warn-soft);color:var(--warn-ink)}
.note.good{background:var(--good-soft);color:var(--good-ink)}
.note.bad{background:var(--bad-soft);color:var(--bad-ink)}
.derived{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}

/* review sheet */
.rv-photo{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:16/10;max-height:34vh;background:var(--surface2);flex:none;transition:max-height .4s ease}

.rv-name{border:0;background:transparent;font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.25;padding:2px 4px;width:100%;box-sizing:border-box;border-radius:10px;resize:none;overflow:hidden;display:block}

.rv-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:0 4px;margin-top:-6px}

.conf.hi{background:var(--good-soft);color:var(--good-ink)} .conf.md{background:var(--warn-soft);color:var(--warn-ink)} .conf.lo{background:var(--bad-soft);color:var(--bad-ink)}
.it{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:10px;transition:opacity .2s}
.it.off{opacity:.5}
.it.chk{box-shadow:0 0 0 2px var(--warn)}
.it-top{display:flex;align-items:center;gap:10px}
.it-em{width:38px;height:38px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-size:20px;flex:none}

.it-name b{display:block;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.badge{display:inline-block;font-size:11.5px;font-weight:800;color:var(--muted);margin-top:2px}
.badge.you{color:var(--accent)} .badge.db{color:var(--good-ink)} .badge.hid{color:var(--warn-ink)} .badge.chk{color:var(--warn-ink)}

.it-nums .sm{display:block;font-size:12px;color:var(--muted)}
.it-x{width:34px;height:34px;border-radius:11px}
.it-hid{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.addrow{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:18px;border:2px dashed var(--line);color:var(--accent);font-weight:800}
.tot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}

.tot .tm{display:flex;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap;justify-content:flex-end}
.tot .tm b{color:var(--fg)}
.loading{display:flex;flex-direction:column;gap:10px}
.sk{height:74px;border-radius:20px;background:linear-gradient(90deg,var(--surface) 0%,var(--surface2) 50%,var(--surface) 100%);background-size:200% 100%;animation:shimmer 1.3s linear infinite}
.caption{text-align:center;font-family:var(--f-display);font-weight:600;color:var(--accent);min-height:1.4em}
.err{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:18px 8px}
.err .mascot{width:90px}
.err p{margin:0;color:var(--muted)}
.ai-tip{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;background:var(--sun-soft);border-radius:16px;padding:12px}
.ai-tip svg{width:20px;height:20px;flex:none;color:var(--warn)}

/* search */
.sr{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);text-align:left;width:100%}
.sr .se{font-size:22px;width:40px;height:40px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;overflow:hidden}
.sr .se img{width:100%;height:100%;object-fit:cover}
.sr b{display:block;font-size:15px;overflow-wrap:anywhere}
.sr .ss{font-size:12.5px;color:var(--muted)}
.sr .sk2{font-family:var(--f-display);font-weight:600;font-size:15px;text-align:right}

.list{display:flex;flex-direction:column;gap:8px}
.listhead{font-size:12.5px;color:var(--muted);font-weight:800;padding:6px 4px 0;text-transform:uppercase;letter-spacing:.06em}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:14px;top:50%;width:20px;height:20px;transform:translateY(-50%);color:var(--muted)}
.searchbox .tin{padding-left:44px}

/* progress */
.pw{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}

.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);font-weight:800}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:14px;height:4px;border-radius:2px;display:inline-block}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}

.trio span{font-size:11.5px;color:var(--muted);display:block;line-height:1.25}
.pbar{height:12px;border-radius:7px;background:var(--surface2);overflow:hidden}
.pbar i{display:block;height:100%;width:0;border-radius:7px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 1s cubic-bezier(.3,1,.4,1)}
.pends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.pends b{color:var(--fg)}
.wrow{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--line)}

.smart{background:linear-gradient(135deg,var(--accent-soft),var(--surface))}
.smart .sv{font-family:var(--f-display);font-weight:700;font-size:30px}

/* coach */
.coach-head{display:flex;align-items:center;gap:12px;min-width:0}
.coach-head .mascot{width:56px}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:11px 14px;border-radius:20px;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.msg.ai{align-self:flex-start;background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:var(--btn);color:#fff;border-bottom-right-radius:6px}
.msg.err{background:var(--bad-soft);color:var(--bad-ink);box-shadow:none}
.msg ul{margin:6px 0 0;padding-left:18px}
.msg p{margin:0 0 6px}
.msg p:last-child{margin:0}
.typing{display:inline-flex;gap:5px;padding:4px 2px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--faint);animation:typ 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.cchips{display:flex;gap:8px;overflow-x:auto;padding:2px 24px 6px 2px;margin:0 -2px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent);scroll-padding:0 24px}
.cchips::-webkit-scrollbar{display:none}
.cchips button{flex:none;font-size:13.5px;font-weight:800;padding:9px 14px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);color:var(--fg)}

/* me */
.steps{margin:0;padding-left:20px;color:var(--muted);font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.keyrow{display:flex;gap:8px}
.keyrow .tin{flex:1;min-width:0}
.ver{text-align:center;font-size:12px;color:var(--faint);padding:8px}

/* onboarding */
.ob{display:flex;flex-direction:column;gap:16px}
.ob .dots{display:flex;gap:6px;justify-content:center}
.ob .dots i{width:8px;height:8px;border-radius:4px;background:var(--line);transition:width .3s,background .3s}
.ob .dots i.on{width:22px;background:var(--accent)}
.ob h2{font-family:var(--f-display);font-weight:700;font-size:28px;margin:0;text-align:center;text-wrap:balance}
.ob p.lead{margin:0;text-align:center;color:var(--muted);text-wrap:balance}
.ob .hero-m{width:150px;margin:6px auto 0;display:block}

/* toast */
.toast{position:fixed;left:16px;right:16px;margin:0 auto;width:fit-content;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:60;transform:translateY(-24px) scale(.92);opacity:0;background:var(--fg);color:var(--bg);border-radius:999px;padding:11px 20px;font-weight:800;font-size:14.5px;pointer-events:none;max-width:calc(100% - 32px);box-sizing:border-box;text-align:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.35);transition:opacity .2s,transform .32s cubic-bezier(.3,1.6,.5,1)}
.toast.show{opacity:1;transform:none}
html.locked .toast{top:calc(env(safe-area-inset-top,0px) + 76px)}

/* mascot */
.mascot{display:inline-block;flex:none;line-height:0}
.mascot svg{display:block;width:100%;height:auto;overflow:visible}
.brand .mascot{width:34px}
.mascot .body{transform-origin:50% 100%;transform-box:fill-box}
.mascot .eyes{transform-origin:center;transform-box:fill-box}

/* motion */
@media (prefers-reduced-motion:no-preference){
  .screen.enter>*{animation:rise .5s cubic-bezier(.2,.9,.3,1.1) both}
  .screen.enter>*:nth-child(2){animation-delay:.04s}
  .screen.enter>*:nth-child(3){animation-delay:.08s}
  .screen.enter>*:nth-child(4){animation-delay:.12s}
  .screen.enter>*:nth-child(5){animation-delay:.16s}

  .mascot .body{animation:bob 2.8s ease-in-out infinite}
  .mascot.jump .body{animation:jump .7s cubic-bezier(.3,1.6,.5,1)}
  .mascot .eyes{animation:blink 4.5s infinite}
  .entry.new,.it.new,.msg.new{animation:rise .45s cubic-bezier(.2,.9,.3,1.1) both}
  .bar-g{transform-origin:50% 100%;transform-box:fill-box;animation:grow .7s cubic-bezier(.3,1.3,.5,1) both}
  .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s ease-out .1s forwards}
  .dotin{transform-box:fill-box;transform-origin:center;animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
  .bump{animation:bump .22s ease}
}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){.scan{animation:none;background:rgba(125,112,255,.15)}.sk{animation:none}.typing i{animation:none}}
@media (max-width:374px){.cal{grid-template-columns:1fr 108px;padding:16px}.ringbox{width:108px;height:108px}.cal .big{font-size:42px}.macro{padding:12px 10px}.macro b{font-size:18px}.entry{grid-template-columns:48px minmax(0,1fr) auto;gap:10px}.thumb{width:48px;height:48px}.it-bot{grid-template-columns:minmax(0,1fr)}.it-nums{text-align:left}}

  const n=(v,a,b)=>{const x=numL(v);return x!=null&&x>=a&&x<=b?x:null};
  if(validKey(o.startDate))s.startDate=o.startDate;
  const sw=n(o.startW,30,300),gw=n(o.goalW,30,300),m=n(o.maint,1000,6000),d=n(o.deficit,0,1500),p=n(o.protein,30,400);
  s.startW=sw==null?null:Math.round(sw*10)/10;s.goalW=gw==null?null:Math.round(gw*10)/10;s.maint=m==null?null:Math.round(m);
  s.deficit=d==null?DEF_SET.deficit:Math.round(d);s.protein=p==null?null:Math.round(p);
  s.notes=typeof o.notes==="string"?o.notes.slice(0,500):"";
  return s;
}
function planValid(s){return !!(s&&validKey(s.startDate)&&ok(s.startW)&&ok(s.goalW)&&ok(s.maint)&&ok(s.deficit)&&s.goalW<s.startW)}
function cleanWeigh(w){
  if(!w||!validKey(w.date)||nOf(w.date)>todayN())return null;
  const kg=numL(w.kg);if(kg==null||kg<30||kg>300)return null;
  return {date:w.date,kg:Math.round(kg*100)/100};
}
function dedupeW(arr){const m=new Map();arr.forEach(w=>{if(w)m.set(w.date,w)});return [...m.values()]}
function cleanItem(it){
  if(!it||typeof it!=="object")return null;
  const n=String(it.n||"Food").slice(0,80);
  const z=v=>Math.max(0,numL(v)||0);
  if(it.fixed)return {n,fixed:true,kcal:clamp(z(it.kcal),0,20000),p:clamp(z(it.p),0,2000),c:clamp(z(it.c),0,4000),f:clamp(z(it.f),0,2000),on:it.on!==false,src:"quick"};
  const o={n,g:clamp(z(it.g),0,MAXG),k:clamp(z(it.k),0,900),p:clamp(z(it.p),0,100),c:clamp(z(it.c),0,100),f:clamp(z(it.f),0,100),on:it.on!==false,src:["db","ai","you"].includes(it.src)?it.src:"ai"};
  if(it.hidden)o.hidden=true;
  if(hasFood(it.key))o.key=it.key;
  const gl=numL(it.gl),gh=numL(it.gh);
  if(gl!=null&&gh!=null){o.gl=clamp(gl,0,MAXG);o.gh=clamp(gh,o.gl,MAXG)}
  return o;
}
function cleanFood(e){
  if(!e||!validKey(e.date)||!Array.isArray(e.items))return null;
  const items=e.items.map(cleanItem).filter(Boolean);
  if(!items.length)return null;
  const out={id:String(e.id||uid()).replace(/[^A-Za-z0-9_-]/g,"").slice(0,40)||uid(),date:e.date,meal:MEAL_NAME[e.meal]?e.meal:"snacks",name:String(e.name||items[0].n).slice(0,80),items,t:ok(e.t)?e.t:Date.now()};
  if(typeof e.thumb==="string"&&/^data:image\/(jpeg|png|webp);base64,/.test(e.thumb))out.thumb=e.thumb;
  if(ok(e.conf))out.conf=clamp(e.conf,0,1);
  return out;
}

  async saveWeigh(w){w=cleanWeigh(w);if(!w)throw new Error("bad");if(storeMode==="db"){await db.doc("weighins/"+w.date).set(w)}else{st.weighins=st.weighins.filter(x=>x.date!==w.date);st.weighins.push(w);LS.set(K.w,st.weighins);changed()}},
  async delWeigh(date){if(storeMode==="db"){await db.doc("weighins/"+date).delete()}else{st.weighins=st.weighins.filter(x=>x.date!==date);LS.set(K.w,st.weighins);changed()}},
  async saveFood(e){e=cleanFood(e);if(!e)throw new Error("bad");if(storeMode==="db"){await db.doc("foods/"+e.id).set(e)}else{st.foods=st.foods.filter(x=>x.id!==e.id);st.foods.push(e);persistFoods();changed()}return e},
  async delFood(id){if(storeMode==="db"){await db.doc("foods/"+id).delete()}else{st.foods=st.foods.filter(x=>x.id!==id);persistFoods();changed()}},

    if(storeMode==="db"){for(const w of st.weighins.slice())await db.doc("weighins/"+w.date).delete();for(const f of st.foods.slice())await db.doc("foods/"+f.id).delete();await db.doc("tracker/settings").delete()}
    else{st.settings=pickSettings(null);st.weighins=[];st.foods=[]}
    [K.set,K.w,K.f,K.chat,K.key,"ct_settings","ct_entries"].forEach(LS.del);
    st.chat=[];changed();
  }
};
function persistFoods(){
  if(LS.set(K.f,st.foods))return;
  // storage full: drop the oldest meal photos one by one until it fits
  const withPics=st.foods.filter(f=>f.thumb).sort((a,b)=>a.t-b.t);let dropped=0;
  for(const f of withPics){delete f.thumb;dropped++;if(LS.set(K.f,st.foods)){toast("Storage full: removed "+dropped+" old meal photo"+(dropped>1?"s":""));return}}
  toast("Phone storage is full. Copy a backup in Me.");
}

/* ---------------- maths ---------------- */
function hasPlan(){return planValid(st.settings)}
function trendRows(){
  const es=st.weighins.filter(w=>ok(w.kg)).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  let t=null,prev=null;
  return es.map(w=>{const d=nOf(w.date);if(t==null)t=w.kg;else t+=(1-Math.pow(1-ALPHA,Math.max(1,d-prev)))*(w.kg-t);prev=d;return {date:w.date,kg:w.kg,day:d,trend:t}});
}
function slopePerDay(rows){
  if(rows.length<3||rows[rows.length-1].day-rows[0].day<4)return null;
  const n=rows.length,mx=rows.reduce((s,r)=>s+r.day,0)/n,my=rows.reduce((s,r)=>s+r.trend,0)/n;let a=0,b=0;
  rows.forEach(r=>{a+=(r.day-mx)*(r.trend-my);b+=(r.day-mx)**2});
  return b?a/b:null;
}
function weightStats(){
  const s=st.settings,rows=trendRows(),W={rows};
  W.rate=ok(s.deficit)&&s.deficit>0?s.deficit*7/KPK:null;
  if(rows.length){
    const last=rows[rows.length-1];W.last=last;W.trend=last.trend;
    const sl=slopePerDay(rows.filter(r=>r.day>last.day-WIN));W.pace=ok(sl)?-sl*7:null;
    const ref=rows.slice().reverse().find(r=>r.day<=last.day-7&&r.day>=last.day-10);
    if(ref){W.week=last.trend-ref.trend;W.weekLbl="this week"}
    else if(rows.length>1){W.week=last.trend-rows[0].trend;W.weekLbl="since "+short(rows[0].day)}
  }
  if(hasPlan()&&W.rate>0){
    const sd=nOf(s.startDate);
    W.sd=sd;
    W.planAt=d=>Math.max(s.goalW,s.startW-W.rate*Math.max(0,d-sd)/7);
    W.planEnd=sd+Math.ceil((s.startW-s.goalW)/W.rate*7);
  }
  if(hasPlan()&&W.last){
    W.lost=s.startW-W.last.trend;W.left=Math.max(0,W.last.trend-s.goalW);
    W.pct=clamp(W.lost/(s.startW-s.goalW)*100,0,100);
    if(W.planAt)W.diff=W.last.trend-W.planAt(W.last.day);
    if(W.pace>0.01&&W.left>0)W.eta=W.last.day+Math.ceil(W.left/W.pace*7);
    if(W.left<=0)W.done=true;
  }
  return W;
}
function curWeight(){const r=trendRows();return r.length?r[r.length-1].trend:(ok(st.settings.startW)?st.settings.startW:null)}
function macroTargets(kcal,proteinSet,w){
  const fat=Math.round(kcal*0.27/9);
  const pmax=Math.max(0,Math.floor((kcal-fat*9)/4));
  let protein=ok(proteinSet)&&proteinSet>0?Math.round(proteinSet):(ok(w)?Math.round(w*1.8/5)*5:null);
  if(protein!=null)protein=Math.min(protein,pmax);
  const carbs=Math.max(0,Math.round((kcal-(protein||0)*4-fat*9)/4));
  return {fat,protein,carbs,pmax};
}
function targets(){
  const s=st.settings;if(!ok(s.maint)||!ok(s.deficit))return null;
  const kcal=Math.round(s.maint-s.deficit);
  const m=macroTargets(kcal,s.protein,curWeight());
  return {kcal,protein:m.protein,fat:m.fat,carbs:m.carbs,autoProtein:!(ok(s.protein)&&s.protein>0)};
}
const Z=()=>({kcal:0,p:0,c:0,f:0});
// every item is rounded once, and all totals add up the rounded numbers, so rows and totals always agree
function itemTot(it){
  if(!it||it.on===false)return Z();
  if(it.fixed)return {kcal:Math.round(it.kcal||0),p:Math.round(it.p||0),c:Math.round(it.c||0),f:Math.round(it.f||0)};
  const g=clamp(num(it.g)||0,0,MAXG)/100;
  return {kcal:Math.round((it.k||0)*g),p:Math.round((it.p||0)*g),c:Math.round((it.c||0)*g),f:Math.round((it.f||0)*g)};
}
function sumTot(items){return items.reduce((a,it)=>{const t=itemTot(it);a.kcal+=t.kcal;a.p+=t.p;a.c+=t.c;a.f+=t.f;return a},Z())}
function entryTot(e){return sumTot(e.items||[])}
function dayFoods(k){return st.foods.filter(e=>e.date===k).sort((a,b)=>a.t-b.t)}
function dayTot(k){const es=dayFoods(k);const t=es.reduce((a,e)=>{const x=entryTot(e);a.kcal+=x.kcal;a.p+=x.p;a.c+=x.c;a.f+=x.f;return a},Z());t.n=es.length;return t}
// kind: noplan | nolog | over | hit | left | under
function dayStatus(n){
  const tg=targets(),t=dayTot(keyOf(n)),isToday=n===todayN();
  if(!tg)return {kind:"noplan",cls:"",text:"Set your plan in Me to see your target",hide:false};
  const diff=Math.round(t.kcal)-tg.kcal;
  if(!t.n)return isToday?{kind:"nolog",cls:"",text:"Nothing logged yet",hide:true}:{kind:"nolog",cls:"",text:"Nothing logged this day",hide:false};
  if(diff>KTOL)return {kind:"over",cls:"bad",text:"Over by "+fk(diff)+" kcal"+(isToday?". Go light for the rest of today":""),diff};
  if(diff>=-KTOL)return {kind:"hit",cls:"good",text:isToday?"Target hit. Nice work":"On target",diff};
  if(isToday){
    if(hourNow()>=20&&-diff>UNDER)return {kind:"under",cls:"warn",text:"Under-eating: "+fk(-diff)+" kcal still left. Don't skip it",diff};
    return {kind:"left",cls:"",text:fk(-diff)+" kcal left",hide:true,diff};
  }
  if(-diff>UNDER)return {kind:"under",cls:"warn",text:"Under by "+fk(-diff)+" kcal",diff};
  return {kind:"hit",cls:"good",text:"On target ("+fk(-diff)+" under)",diff};
}
const KIND_COL={over:"var(--bad)",hit:"var(--good)",under:"var(--warn)",left:"var(--accent)"};
function streak(){
  const has=new Set(st.foods.map(f=>f.date));let n=todayN();if(!has.has(keyOf(n)))n--;let c=0;
  while(has.has(keyOf(n))){c++;n--}
  return c;
}
function defaultMeal(){const h=hourNow();return h>=4&&h<11?"breakfast":h>=11&&h<15?"lunch":h>=18&&h<22?"dinner":"snacks"}
function smartMaint(){
  const s=st.settings,tg=targets();if(!tg||!hasPlan())return {need:"plan"};
  const t=todayN(),fEnd=t-1,start=t-28;
  const days=[];for(let n=start;n<=fEnd;n++){const d=dayTot(keyOf(n));if(d.n&&d.kcal>=tg.kcal*0.5)days.push(d.kcal)}
  const rows=trendRows().filter(r=>r.day>=start&&r.day<=t);
  const span=rows.length?rows[rows.length-1].day-rows[0].day:0;
  const res={logged:days.length,weighs:rows.length,span};
  if(days.length<10||rows.length<6||span<10)return Object.assign(res,{need:"data"});
  const sl=slopePerDay(rows);if(!ok(sl))return Object.assign(res,{need:"data"});
  const avg=days.reduce((a,b)=>a+b,0)/days.length;
  const est=Math.round((avg-sl*KPK)/10)*10;
  if(est<1200||est>5000)return Object.assign(res,{need:"odd",est});
  return Object.assign(res,{est,avg,diff:est-s.maint});
}
function estimateMaint({sex,age,height,weight,act}){
  if(![age,height,weight,act].every(ok))return null;
  const bmr=10*weight+6.25*height-5*age+(sex==="f"?-161:5);
  return Math.round(bmr*act/10)*10;
}

function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),2000)}
function countTo(el,to,fmt){
  if(!el)return;
  el._cid=(el._cid||0)+1;
  if(!ok(to)){el.textContent="–";el.dataset.cv="";return}
  const prev=el.dataset.cv;el.dataset.cv=to;
  const from=prev!==undefined&&prev!==""?Number(prev):to;
  if(RM||from===to||!isFinite(from)){el.textContent=fmt(to);return}
  const t0=performance.now();const id=el._cid;
  const step=t=>{if(el._cid!==id)return;const p=Math.min(1,(t-t0)/700),e=1-Math.pow(1-p,3);el.textContent=fmt(from+(to-from)*e);if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}

let hold=null;
function bump(sp,dir){
  const inp=sp.querySelector("input");const step=Number(sp.dataset.step)||1,dec=Number(sp.dataset.dec)||0,min=Number(sp.dataset.min),max=Number(sp.dataset.max);
  let v=num(inp.value);if(v==null)v=dir>0?(isFinite(min)&&min>0?min-step:0):(num(inp.placeholder)||0);
  v=Math.round((v+step*dir)/step)*step;v=clamp(v,isFinite(min)?min:-1e9,isFinite(max)?max:1e9);
  inp.value=v.toFixed(dec);inp.dispatchEvent(new Event("input",{bubbles:true}));
  inp.classList.remove("bump");void inp.offsetWidth;inp.classList.add("bump");
}
function stopHold(){if(hold){clearTimeout(hold.t);clearInterval(hold.i);hold=null}}
document.addEventListener("pointerdown",e=>{

  e.preventDefault();stopHold();const sp=b.closest(".stepper"),d=Number(b.dataset.d);bump(sp,d);
  let n=0;hold={t:setTimeout(()=>{if(hold)hold.i=setInterval(()=>{n++;bump(sp,d*(n>15?5:1))},70)},420)};
});

const sheetStack=[];
function openSheet({title="",body="",foot="",cls="",onClose=null,dismiss=true,headExtra=""}){
  const opener=document.activeElement;
  const scrim=document.createElement("div");scrim.className="scrim";
  const sh=document.createElement("div");sh.className="sheet "+cls+(dismiss?"":" fixed")+(foot?" hasfoot":"");sh.setAttribute("role","dialog");sh.setAttribute("aria-modal","true");sh.tabIndex=-1;if(title)sh.setAttribute("aria-label",title);

  $("#sheets").append(scrim,sh);
  const rec={sh,scrim,onClose,dismiss,closed:false,opener};sheetStack.push(rec);
  document.documentElement.classList.add("locked");
  requestAnimationFrame(()=>requestAnimationFrame(()=>{scrim.classList.add("in");sh.classList.add("in");try{sh.focus({preventScroll:true})}catch(e){}}));

function closeSheet(sh,silent){
  const i=sheetStack.findIndex(r=>r.sh===sh);if(i<0)return;const rec=sheetStack[i];if(rec.closed)return;rec.closed=true;sheetStack.splice(i,1);
  sh.classList.remove("in");rec.scrim.classList.remove("in");sh.style.transform="";sh.style.pointerEvents="none";
  setTimeout(()=>{sh.remove();rec.scrim.remove()},380);

  if(rec.opener&&rec.opener.isConnected&&typeof rec.opener.focus==="function"){try{rec.opener.focus({preventScroll:true})}catch(e){}}

}
function closeAll(){sheetStack.slice().reverse().forEach(r=>closeSheet(r.sh))}
function dragToClose(sh){
  let y0=null,dy=0,t0=0;
  const begin=y=>{y0=y;dy=0;t0=performance.now();sh.classList.add("drag")};
  const move=y=>{dy=Math.max(0,y-y0);sh.style.transform=`translateY(${dy}px)`};
  const end=()=>{if(y0==null)return;sh.classList.remove("drag");const v=dy/Math.max(1,performance.now()-t0);if(dy>110||(v>0.6&&dy>30))closeSheet(sh);else sh.style.transform="";y0=null};
  [sh.querySelector(".grab"),sh.querySelector(".sh-head")].filter(Boolean).forEach(z=>{
    z.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;begin(e.clientY);try{z.setPointerCapture(e.pointerId)}catch(err){}});
    z.addEventListener("pointermove",e=>{if(y0!=null)move(e.clientY)});
    z.addEventListener("pointerup",end);z.addEventListener("pointercancel",end);
  });
  // pull down from the body when it is scrolled to the top (touch only)
  const body=sh.querySelector(".sh-body");let ty=null,pulling=false;
  body.addEventListener("touchstart",e=>{if(e.touches.length!==1||body.scrollTop>0||e.target.closest("input,textarea,.stepper,.cchips")){ty=null;return}ty=e.touches[0].clientY;pulling=false},{passive:true});
  body.addEventListener("touchmove",e=>{if(ty==null)return;const d=e.touches[0].clientY-ty;if(!pulling){if(d>8&&body.scrollTop<=0){pulling=true;begin(ty)}else if(d<0){ty=null;return}}if(pulling){e.preventDefault();move(e.touches[0].clientY)}},{passive:false});
  const tend=()=>{if(pulling)end();ty=null;pulling=false};
  body.addEventListener("touchend",tend);body.addEventListener("touchcancel",tend);
}
document.addEventListener("keydown",e=>{

const AI_MSG={key:"Your AI key was rejected.",quota:"AI limit reached for now. Wait a minute and try again.",busy:"The AI is busy. Try again in a moment.",network:"No connection. Check your internet and try again.",nofood:"Couldn't spot any food in that photo. Try another angle, or describe it instead.",notext:"Couldn't work out the food from that. Add a bit more detail.",parse:"Scaley got muddled reading that. Try again.",blocked:"The AI refused that one. Try a different photo or wording.",nokey:"Add an AI key first.",denied:"AI access wasn't allowed here.",timeout:"That took too long. Try again."};

function mapHttp(status,body){
  const b=String(body||"").toLowerCase();

  if(status===429)return new AIErr("quota");
  if(status===400&&/safety|blocked/.test(b))return new AIErr("blocked");
  return new AIErr("busy");
}
// turns: [{role:"user"|"assistant", text}]; image {b64, blob} goes with the last user turn
async function aiCall({system,turns,image,json=false,maxTokens=1600,quick=false}){
  const mode=aiMode();if(!mode)throw new AIErr("nokey");
  const ts=[];for(const t of turns){if(!t.text)continue;if(!ts.length&&t.role!=="user")continue;const last=ts[ts.length-1];if(last&&last.role===t.role)last.text+="\n\n"+t.text;else ts.push({role:t.role,text:t.text})}
  if(!ts.length||ts[ts.length-1].role!=="user")throw new AIErr("parse");
  if(mode==="claude"){
    const input=[{role:"user",content:system+(json?"\n\nReply with JSON only.":"")}].concat(ts.map(t=>({role:t.role,content:t.text})));
    const opts={cache:false};if(image&&image.blob)opts.images=[image.blob];if(quick)opts.modelTier="quick";
    try{const r=await st.sample(input,opts);return r.text}
    catch(e){const c=e&&e.code;throw new AIErr(c==="rate_limited"?"quota":c==="not_granted"||c==="sampling_disabled"?"denied":c==="refused"?"blocked":c==="images_unavailable"||c==="image_rejected"?"nofood":"busy")}
  }
  const key=getKey().trim();
  if(mode==="anthropic"){
    const models=quick?["claude-haiku-5-5","claude-sonnet-5-5"]:["claude-sonnet-5-5","claude-sonnet-4-5"];
    const msgs=ts.map((t,i)=>{const content=[];if(image&&i===ts.length-1)content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:image.b64}});content.push({type:"text",text:t.text});return {role:t.role,content}});
    let lastErr=null;
    for(const model of models){
      const res=await fetchT("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model,max_tokens:maxTokens,system,messages:msgs})});
      if(res.status===404){lastErr=new AIErr("busy");continue}
      if(!res.ok){const tx=await res.text().catch(()=>"");lastErr=mapHttp(res.status,tx);if(lastErr.code==="busy"&&res.status>=500)continue;throw lastErr}
      const data=await res.json().catch(()=>null);
      const text=data&&Array.isArray(data.content)?data.content.filter(b=>b.type==="text").map(b=>b.text).join(""):"";
      if(!text)throw new AIErr("parse");
      return text;
    }
    throw lastErr||new AIErr("busy");
  }
  const models=["gemini-flash-latest","gemini-2.5-flash"];
  const contents=ts.map((t,i)=>{const parts=[];if(image&&i===ts.length-1)parts.push({inline_data:{mime_type:"image/jpeg",data:image.b64}});parts.push({text:t.text});return {role:t.role==="assistant"?"model":"user",parts}});
  const gen={temperature:json?0.2:0.7,maxOutputTokens:8192};if(json)gen.responseMimeType="application/json";
  let lastErr=null;
  for(let i=0;i<models.length;i++){
    const res=await fetchT("https://generativelanguage.googleapis.com/v1beta/models/"+models[i]+":generateContent?key="+encodeURIComponent(key),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents,generationConfig:gen})});
    if(!res.ok){const tx=await res.text().catch(()=>"");lastErr=res.status===404?new AIErr("busy"):mapHttp(res.status,tx);if((res.status===404||res.status===429||res.status>=500)&&i<models.length-1)continue;throw lastErr}
    const data=await res.json().catch(()=>null);
    const cand=data&&data.candidates&&data.candidates[0];
    const text=cand&&cand.content&&Array.isArray(cand.content.parts)?cand.content.parts.map(p=>p.text||"").join(""):"";
    if(!text){if((data&&data.promptFeedback&&data.promptFeedback.blockReason)||(cand&&cand.finishReason==="SAFETY"))throw new AIErr("blocked");throw new AIErr("parse")}
    return text;
  }
  throw lastErr||new AIErr("busy");
}
function parseJSON(text){
  let s=String(text||"").trim();
  const fence=s.match(/```(?:json)?\s*([\s\S]*?)```/i);if(fence)s=fence[1].trim();
  try{return JSON.parse(s)}catch(e){}
  const a=s.indexOf("{"),b=s.lastIndexOf("}");
  if(a>=0&&b>a){try{return JSON.parse(s.slice(a,b+1))}catch(e){}}
  throw new AIErr("parse");
}

const FOOD_SYS=`You are Scaley's food analyst: a meticulous sports dietitian who estimates nutrition from a meal photo or a written description. Work through these steps silently, then reply with JSON only.

1. COMPONENTS. List every separate food, sauce, drink and garnish you can see or that is described. Split mixed plates into parts (for example: chicken, rice, cucumber, chilli sauce, soup). At most 10 items.
2. PREPARATION. Decide how each item was cooked: raw, boiled, steamed, grilled, roasted, stir-fried, pan-fried, deep-fried, curried, in gravy or sauce. Preparation changes calories a lot.
3. PORTION. Estimate each item's weight in grams as served (cooked weight). Use size cues: dinner plate about 26 cm, side plate 20 cm, rice bowl 11 cm, soup bowl 15 cm, tablespoon 15 ml, fork 19 cm, chopsticks 23 cm, adult palm 8 x 9 cm, cup 250 ml, can 330 ml, food packaging and labels. Estimate volume first, then convert with density (cooked rice about 0.8 g/ml, meat about 1.0 g/ml, leafy veg about 0.3 g/ml, soup and drinks about 1.0 g/ml). Give a low and high bound that reflects how sure you are. Grams must be plain numbers.
4. HIDDEN CALORIES. Add separate items, marked "hidden": true, for cooking oil, butter, ghee, chicken-fat or coconut rice oil, gravy, dressings, and sugar, syrup or condensed milk in drinks when they are likely present and not already counted. Typical amounts: stir-fried plate 8-15 g oil, pan-fried 5-10 g, a ladle of gravy 60 g. Deep-fried foods: fold the absorbed oil into that item's per-100 g values instead of adding oil.
5. NUTRITION. For each item give kcal, protein, carbs, fat and alcohol per 100 g as served, matching its preparation. kcal must be close to 4*protein + 4*carbs + 9*fat + 7*alcohol.
6. DATABASE. If an item is the same food AND preparation as an entry in the DATABASE list, set "db" to its key. Otherwise "db": null. Use the database to sanity-check your values.
7. SANITY CHECK. Compare your total with typical values for this dish and portion. Fix anything far off.
8. USER NOTES ARE FACTS. If the user states a weight, item, brand or cooking method, use it exactly and do not re-estimate it.

If there is no food or drink, reply {"not_food": true}.

Reply with exactly this JSON shape:
{"dish":"short meal name","confidence":0.0,"items":[{"name":"","grams":0,"grams_low":0,"grams_high":0,"kcal_100g":0,"protein_100g":0,"carbs_100g":0,"fat_100g":0,"alcohol_100g":0,"hidden":false,"db":null}],"tip":"one short, practical sentence about this meal for someone trying to lose fat"}`;

// turns the AI's estimate into clean items; app-side checks catch impossible numbers
function normalizeAI(j,fromImage){
  if(j&&j.not_food)throw new AIErr(fromImage?"nofood":"notext");
  const arr=Array.isArray(j&&j.items)?j.items.slice(0,15):[];
  const items=[];
  for(const x of arr){
    if(!x||typeof x!=="object")continue;
    const name=String(x.name||"").trim().slice(0,60);if(!name)continue;
    const g=Math.round(clamp(numL(x.grams)||0,0,MAXG));
    let gl=numL(x.grams_low),gh=numL(x.grams_high);
    gl=gl==null?g*0.8:clamp(gl,0,MAXG);gh=gh==null?g*1.2:clamp(gh,0,MAXG);
    if(gl>g)gl=g;if(gh<g)gh=g;
    const nn=v=>clamp(numL(v)||0,0,100);
    let k=clamp(numL(x.kcal_100g)||0,0,900),p=nn(x.protein_100g),c=nn(x.carbs_100g),f=nn(x.fat_100g),al=nn(x.alcohol_100g);
    let src="ai",key=null;
    if(hasFood(x.db)){const d=FOOD[x.db];if(k<=0||Math.abs(k-d.k)/Math.max(d.k,1)<=0.3){k=d.k;p=d.p;c=d.c;f=d.f;src="db";key=d.key}}
    if(src==="ai"){
      const calc=4*p+4*c+9*f+7*al;
      const drink=ALCOHOL.test(name)||al>0;
      if(calc>0&&(k<=0||Math.abs(k-calc)/Math.max(k,calc)>0.25)&&!(drink&&k>calc))k=Math.round(calc);
      k=clamp(k,0,900);
    }
    const it={n:name,g,gl:Math.round(gl),gh:Math.round(gh),k,p,c,f,src,on:true};
    if(x.hidden)it.hidden=true;if(key)it.key=key;
    items.push(it);
  }
  if(!items.length)throw new AIErr(fromImage?"nofood":"notext");
  return {dish:String((j&&j.dish)||items[0].n).slice(0,60),conf:ok(numL(j.confidence))?clamp(numL(j.confidence),0,1):0.6,items,tip:String((j&&j.tip)||"").slice(0,220)};
}
async function analyzeFood({image,text,note}){

}

function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("img"));i.src=src})}
async function prepImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await loadImg(url);
    const W=img.naturalWidth,H=img.naturalHeight;if(!W||!H)throw new Error("img");
    const sc=Math.min(1,1280/Math.max(W,H));const cw=Math.round(W*sc),ch=Math.round(H*sc);
    const cv=document.createElement("canvas");cv.width=cw;cv.height=ch;cv.getContext("2d").drawImage(img,0,0,cw,ch);
    const dataUrl=cv.toDataURL("image/jpeg",0.84);
    const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.84));
    const s=Math.min(W,H),tv=document.createElement("canvas");tv.width=tv.height=160;
    tv.getContext("2d").drawImage(img,(W-s)/2,(H-s)/2,s,s,0,0,160,160);
    return {dataUrl,b64:dataUrl.split(",")[1],blob,thumb:tv.toDataURL("image/jpeg",0.6)};
  } finally {URL.revokeObjectURL(url)}
}

  const h=hourNow(),left=tg.kcal-tot.kcal,pl=tg.protein?tg.protein-tot.p:0;

// returns {errors:[...], warns:[...]} for a plan the user typed
function checkPlan(r){
  const E=[],Wn=[];
  if(!validKey(r.startDate))E.push("Pick a start date.");else if(nOf(r.startDate)>todayN())E.push("The start date can't be in the future.");
  if(!ok(r.startW)||r.startW<30||r.startW>300)E.push("Start weight must be between 30 and 300 kg.");
  if(!ok(r.goalW)||r.goalW<30||r.goalW>300)E.push("Goal weight must be between 30 and 300 kg.");
  else if(ok(r.startW)&&r.goalW>=r.startW)E.push("Goal weight must be below start weight.");
  if(!ok(r.maint)||r.maint<1000||r.maint>6000)E.push("Maintenance must be between 1,000 and 6,000 kcal.");
  if(!ok(r.deficit)||r.deficit<0||r.deficit>1500)E.push("Deficit must be between 0 and 1,500 kcal.");
  if(ok(r.maint)&&ok(r.deficit)&&r.maint-r.deficit<1200&&r.deficit>=0)E.push("That means eating under 1,200 kcal a day. Lower the deficit.");
  if(r.protein!=null){const w=curWeight()||r.startW;const m=ok(r.maint)&&ok(r.deficit)?macroTargets(Math.round(r.maint-r.deficit),null,w):null;if(!ok(r.protein)||r.protein<30)E.push("Protein goal must be at least 30 g.");else if(m&&r.protein>m.pmax)E.push("Protein can't be more than "+m.pmax+" g on "+fk(r.maint-r.deficit)+" kcal.")}

  }

}

async function doLog(again,btn){

/* ---------------- search ---------------- */
function recentItems(){
  const seen=new Set(),out=[];
  st.foods.slice().sort((a,b)=>b.t-a.t).forEach(e=>e.items.forEach(it=>{if(it.hidden||it.fixed||!(it.g>0))return;const k=it.n.toLowerCase();if(seen.has(k))return;seen.add(k);out.push(it)}));
  return out.slice(0,8);
}
function recentMeals(){
  const seen=new Set(),out=[];
  st.foods.slice().sort((a,b)=>b.t-a.t).forEach(e=>{const k=e.name.toLowerCase();if(seen.has(k))return;seen.add(k);out.push(e)});
  return out.slice(0,5);
}
function searchFoods(q){
  const toks=q.toLowerCase().trim().split(/\s+/).filter(t=>t.length>0);if(!toks.length)return [];
  return FOODS.map(r=>{const name=r[1].toLowerCase(),al=(r[7]||"").toLowerCase();let s=0,hit=0;for(const t of toks){if(name.startsWith(t)){s+=4;hit++}else if(new RegExp("\\b"+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).test(name)){s+=3;hit++}else if(name.includes(t)){s+=2;hit++}else if(al.includes(t)){s+=1;hit++}}return hit?{r,s:s+hit*5}:null}).filter(Boolean).sort((a,b)=>b.s-a.s).slice(0,30).map(x=>FOOD[x.r[0]]);
}
function openSearch(mode){

      if(ri.length)h+=`<div class="listhead">Recent foods</div>`+ri.map((it,i)=>`<button type="button" class="sr" data-s="ri:${i}"><span class="se">${foodEmoji(it.n)}</span><span><b>${esc(it.n)}</b><span class="ss">${Math.round(it.g)}g last time</span></span><span class="sk2 num">${fk(itemTot(Object.assign({},it,{on:true})).kcal)}<small>kcal</small></span></button>`).join("");
      if(!rm.length&&!ri.length)h+=`<p class="sub" style="text-align:center">Search ${FOODS.length} foods, from hawker dishes to basics.</p>`;
    } else {
      const r=searchFoods(q);

      h+=`<button type="button" class="sr" data-s="ai"><span class="se" style="color:var(--accent)">✨</span><span><b>Ask AI about “${esc(q.trim().slice(0,40))}”</b><span class="ss">${aiReady()?"Estimates anything":"Needs a free AI key"}</span></span><span></span></button>`;
      if(mode!=="add")h+=quickRow;

  const fill=()=>{
    const k=keyOf(day),ex=st.weighins.find(w=>w.date===k),rows=trendRows();
    sh.querySelector("#wDay").textContent=dayName(day);
    const pre=hasPlan()&&day<nOf(st.settings.startDate);const hn=sh.querySelector("#wHint");hn.className="note"+(pre?" warn":"");hn.textContent=pre?"This day is before your plan started ("+shortY(nOf(st.settings.startDate))+"). It still counts in your trend.":"Best time: in the morning, after the toilet, before food or water.";const nx=sh.querySelector("#wNext");nx.disabled=day>=todayN();nx.style.opacity=day>=todayN()?.3:1;
    inp.value=ex?ex.kg.toFixed(1):rows.length?rows[rows.length-1].kg.toFixed(1):ok(st.settings.startW)?st.settings.startW.toFixed(1):"70.0";fitInput(inp);
    sh.querySelector("#wBtns").innerHTML=ex?`<button type="button" class="btn danger" id="wDel">Delete</button><button type="button" class="btn" id="wSave">Update</button>`:`<button type="button" class="btn" id="wSave" style="grid-column:1/-1">Save weight</button>`;
    const sb=sh.querySelector("#wSave");sb.addEventListener("click",()=>save(sb));
    const d=sh.querySelector("#wDel");if(d)d.addEventListener("click",async()=>{if(!d.dataset.armed){d.dataset.armed="1";d.textContent="Tap again";setTimeout(()=>{if(d.isConnected){delete d.dataset.armed;d.textContent="Delete"}},3000);return}try{await store.delWeigh(k);closeSheet(sh,true);toast("Weigh-in deleted");render()}catch(e){toast("Couldn't delete")}});
  };
  sh.querySelector("#wPrev").addEventListener("click",()=>{day--;fill()});

/* ---------------- onboarding ---------------- */
function openOnboarding(){
  const o={step:0,w:70,goal:65,maint:2200,def:500};
  const sh=openSheet({title:"",cls:"full",dismiss:false,body:`<div class="ob" id="ob"></div>`,foot:`<div id="obFoot" style="display:flex;flex-direction:column;gap:10px"></div>`});
  const box=sh.querySelector("#ob"),foot=sh.querySelector("#obFoot");
  const dots=()=>`<div class="dots">${[0,1,2,3].map(i=>`<i class="${i===o.step?"on":""}"></i>`).join("")}</div>`;
  const g=id=>{const e=box.querySelector(id);return e?num(e.value):null};
  const read=()=>{if(o.step===1){o.w=g("#obW");o.goal=g("#obG")}if(o.step===2){o.maint=g("#obM");o.def=g("#obD")}};
  const err=t=>{const e=box.querySelector("#obErr");if(e)e.innerHTML=t?`<div class="note bad">${esc(t)}</div>`:""};

  box.addEventListener("input",upd2);
  const draw=()=>{
    let h=dots(),f="";
    if(o.step===0){h+=`<span class="mascot hero-m" data-mascot="ob"></span><h2>Hi, I'm Scaley</h2><p class="lead">I count your calories from photos, track your real weight trend and tell you straight if you're on track.</p>`;f=`<button type="button" class="btn" data-ob="next">Let's set you up</button><button type="button" class="btn plain" data-ob="restore">I have a backup</button>`}
    if(o.step===1){h+=`<h2>Your weight</h2><p class="lead">Where you are now and where you want to be.</p><div class="field"><span class="lbl">Current weight</span>${stepper("obW",o.w,{step:0.1,dec:1,min:30,max:300,size:"xl",label:"Current weight",unit:"kg"})}</div><div class="field"><span class="lbl">Goal weight</span>${stepper("obG",o.goal,{step:0.1,dec:1,min:30,max:300,size:"xl",label:"Goal weight",unit:"kg"})}</div><div id="obErr"></div>`;f=`<div class="btnrow">${back}<button type="button" class="btn" data-ob="next">Next</button></div>`}
    if(o.step===2){h+=`<h2>Your calories</h2><p class="lead">Maintenance is what keeps your weight flat. Don't know it? Estimate it. I'll learn your real number in 2 weeks.</p><div class="field"><span class="lbl">Maintenance (kcal a day)</span>${stepper("obM",o.maint,{step:10,dec:0,min:1000,max:6000,size:"xl",label:"Maintenance",unit:"kcal"})}<button type="button" class="linkbtn" data-ob="estimate" style="align-self:center">Not sure? Estimate it</button></div><div class="field"><span class="lbl">How fast?</span>${presetPicks(o.def)}${stepper("obD",o.def,{step:10,dec:0,min:0,max:1500,label:"Daily deficit",unit:"kcal"})}</div><div class="derived" id="obDer"></div><div id="obWarn"></div><div id="obErr"></div>`;f=`<div class="btnrow">${back}<button type="button" class="btn" data-ob="next">Next</button></div>`}

      else{h+=`<span class="mascot hero-m" data-mascot="ob"></span><h2>Turn on the AI</h2><p class="lead">Snap a meal and I'll count it. Paste a free Google Gemini key to unlock photos and coaching.</p><ol class="steps"><li>Open <a class="link" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a></li><li>Tap <b>Create API key</b> and copy it</li><li>Paste it below</li></ol><input class="tin" id="obKey" type="password" autocomplete="off" spellcheck="false" placeholder="AIza… or sk-ant-…" aria-label="AI key"><div id="obErr"></div>`;f=`<button type="button" class="btn" data-ob="done" data-key="1">Save key &amp; start</button><button type="button" class="btn plain" data-ob="done">Skip for now</button>`}
    }
    box.innerHTML=h;foot.innerHTML=f;paintMascots();fitAll(box);upd2();
    sh.querySelector(".sh-body").scrollTop=0;
  };

    const kin=box.querySelector("#obKey"),kv=kin?kin.value.trim():"";

    await busy(b,async()=>{

        await store.saveSettings({startDate:keyOf(todayN()),startW:Math.round(o.w*10)/10,goalW:Math.round(o.goal*10)/10,maint:Math.round(o.maint),deficit:Math.round(o.def),protein:null,notes:""});
        await store.saveWeigh({date:keyOf(todayN()),kg:Math.round(o.w*10)/10});
        closeSheet(sh,true);showTab("home");toast("You're all set!");jump();

      }catch(e){toast("Couldn't save. Try again.")}
    });
  };
  const act=e=>{
    const b=e.target.closest("[data-ob],[data-preset]");if(!b)return;
    if(b.dataset.preset){const d=box.querySelector("#obD");if(d){d.value=b.dataset.preset;d.dispatchEvent(new Event("input",{bubbles:true}))}return}
    const a=b.dataset.ob;read();
    if(a==="back"){o.step--;draw();return}
    if(a==="restore"){openRestore();return}
    if(a==="estimate"){openEstimate(v=>{const m=box.querySelector("#obM");if(m){m.value=String(v);m.dispatchEvent(new Event("input",{bubbles:true}))}},o.w);return}
    if(a==="next"){
      if(o.step===1){if(!ok(o.w)||o.w<30||o.w>300||!ok(o.goal)||o.goal<30||o.goal>300){err("Weights must be between 30 and 300 kg.");return}if(o.goal>=o.w){err("Goal weight must be below your current weight.");return}}
      if(o.step===2){if(!ok(o.maint)||o.maint<1000||o.maint>6000){err("Maintenance must be between 1,000 and 6,000 kcal.");return}if(!ok(o.def)||o.def<0||o.def>1500){err("Deficit must be between 0 and 1,500 kcal.");return}if(o.maint-o.def<1200){err("That puts you under 1,200 kcal. Lower the deficit.");return}}
      o.step++;draw();return}
    if(a==="done")finish(b,!!b.dataset.key);
  };
  box.addEventListener("click",act);foot.addEventListener("click",act);
  draw();
}

function backupText(){return JSON.stringify({app:"scaley",v:3,settings:st.settings,weighins:st.weighins,foods:st.foods.map(f=>{const c=Object.assign({},f);delete c.thumb;return c})})}
function openRestore(){
  const sh=openSheet({title:"Restore backup",body:`<p class="sub" style="margin:0">Paste the backup text you copied earlier. Matching days and meals get replaced.</p><textarea class="tin" id="rsText" rows="6" placeholder="Paste backup here" aria-label="Backup text" style="font-size:13px;font-family:ui-monospace,Menlo,monospace"></textarea><div id="rsMsg"></div>`,foot:`<button type="button" class="btn" id="rsGo">Restore</button>`});

    const m=sh.querySelector("#rsMsg");let d;try{d=JSON.parse(sh.querySelector("#rsText").value)}catch(e){m.innerHTML=`<div class="note bad">That isn't valid backup text. Copy the whole thing and try again.</div>`;return}
    if(!d||typeof d!=="object"||(d.app!=="scaley"&&d.app!=="cut-tracker")){m.innerHTML=`<div class="note bad">That isn't a Scaley backup.</div>`;return}
    const rawW=Array.isArray(d.weighins)?d.weighins:Array.isArray(d.entries)?d.entries:[],rawF=Array.isArray(d.foods)?d.foods:[];
    const ws=dedupeW(rawW.map(cleanWeigh).filter(Boolean)),fs=rawF.map(cleanFood).filter(Boolean);

    m.innerHTML=`<div class="note">Restoring…</div>`;
    try{
      if(usePlan)await store.saveSettings(Object.assign(ps,{notes:ps.notes||st.settings.notes}));
      for(const w of ws)await store.saveWeigh(w);
      for(const f of fs)await store.saveFood(f);
      closeAll();setDirty(false);showTab("home");toast(`Restored ${ws.length} weigh-ins, ${fs.length} meals${skipped?` (${skipped} skipped)`:""}`);jump();
    }catch(e){m.innerHTML=`<div class="note bad">Restore stopped part-way. Try again.</div>`}
  }));
}

/* ---------------- boot ---------------- */
function bootLocal(){
  storeMode="local";
  let s=LS.get(K.set),w=LS.get(K.w),f=LS.get(K.f);
  if(!s&&!w){const os=LS.get("ct_settings"),ow=LS.get("ct_entries");if(os||ow){s=pickSettings(os);w=dedupeW((Array.isArray(ow)?ow:[]).map(cleanWeigh).filter(Boolean));LS.set(K.set,s);LS.set(K.w,w);LS.del("ct_settings");LS.del("ct_entries")}}
  st.settings=pickSettings(s);st.weighins=dedupeW((Array.isArray(w)?w:[]).map(cleanWeigh).filter(Boolean));st.foods=(Array.isArray(f)?f:[]).map(cleanFood).filter(Boolean);
  finishBoot();
}
function finishBoot(){
  st.chat=(LS.get(K.chat)||[]).filter(m=>m&&(m.role==="user"||m.role==="assistant")&&typeof m.text==="string");
  st.loaded=true;showTab("home");

(async()=>{

  if(!d){bootLocal();return}
  db=d;storeMode="db";
